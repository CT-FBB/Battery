<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLT Battery Dashboards</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #030712; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        .tab-bar { display: flex; background: rgba(30, 41, 59, 0.9); backdrop-filter: blur(10px); padding: 15px 30px; gap: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 10; }
        .title { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 700; margin-right: auto; background: linear-gradient(135deg, #38bdf8, #818cf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .tab-btn { background: rgba(255,255,255,0.05); color: #94a3b8; border: 1px solid rgba(255,255,255,0.1); padding: 10px 25px; border-radius: 12px; cursor: pointer; font-family: 'Outfit', sans-serif; font-weight: 600; font-size: 1rem; transition: all 0.3s ease; }
        .tab-btn:hover { background: rgba(255,255,255,0.1); color: #fff; transform: translateY(-1px); }
        .tab-btn.active { background: #38bdf8; color: #fff; border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        .tab-btn.hw-active { background: #f43f5e; color: #fff; border-color: #f43f5e; box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
        .tab-btn.zte-active { background: #10b981; color: #fff; border-color: #10b981; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
        iframe { flex: 1; width: 100%; border: none; background: #030712; }
    </style>
</head>
<body>
    <div class="tab-bar">
        <div class="title">OLT Battery Monitoring</div>
        <button class="tab-btn active" onclick="switchTab('fbh_battery.html', this, 'active')">Fiberhome (FBH)</button>
        <button class="tab-btn" onclick="switchTab('hw_battery.html', this, 'hw-active')">Huawei (HW)</button>
        <button class="tab-btn" onclick="switchTab('zte_battery.html', this, 'zte-active')">ZTE</button>
    </div>
    <iframe id="dashboardFrame" src="fbh_battery.html"></iframe>
    <script>
        function switchTab(url, btn, activeClass) {
            document.getElementById('dashboardFrame').src = url;
            document.querySelectorAll('.tab-btn').forEach(b => {
                b.classList.remove('active');
                b.classList.remove('hw-active');
                b.classList.remove('zte-active');
            });
            btn.classList.add(activeClass);
        }
    </script>
</body>
</html>
